name: BeamMP experimental checks

on:
  push:
    branches: ['beammp/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt lupa
      - run: python tools/run_lua_tests.py mod/tests/test_*.lua
      - run: python -m unittest discover -s server/tests -p test_mpprofile.py
      - run: python -m unittest discover -s server/tests -p test_mpbridge.py
      - run: python -m unittest discover -s server/tests -p test_remoteassets.py
      - run: python -m unittest discover -s server/tests -p test_centralserver.py
      - run: python -m unittest discover -s server/tests -p test_centralstartup.py
      - run: python -m unittest discover -s server/tests -p test_server.py -k test_heightmap_cleanup_and_errors
      - run: python -m unittest discover -s server/tests -p test_geodesy.py
      - run: python -m unittest discover -s server/tests -p test_protocol.py
      - run: python -m unittest discover -s server/tests -p test_protocol_agreement.py
      - run: python tools/package_beammp.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-BeamMP-experimental
          path: dist/beammp-central/
